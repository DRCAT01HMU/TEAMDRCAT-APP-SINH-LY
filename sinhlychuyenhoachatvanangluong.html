    <style id="performance-optimizations">
        /* Optimize glass-panel class */
        .glass-panel { 
            backdrop-filter: none !important; 
            -webkit-backdrop-filter: none !important; 
            background: rgba(255, 255, 255, 0.98) !important; 
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05) !important; 
            border: 1px solid rgba(226, 232, 240, 1) !important; 
        }
        .dark .glass-panel { 
            background: rgba(15, 23, 42, 0.98) !important; 
            border-color: rgba(51, 65, 85, 1) !important; 
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3) !important;
        }

        /* Optimize list rendering */
        div[class*="border-slate-100"] {
            content-visibility: auto;
            contain-intrinsic-size: 0 200px;
        }

        /* Disable heavy hover shadows and scaling */
        .hover\:shadow-2xl:hover, .shadow-2xl, .shadow-xl {
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1) !important;
        }

        /* Disable heavy blur backdrops */

    <!-- SECURITY SCRIPT -->
    <script>
        // Disable Right Click
        document.addEventListener('contextmenu', event => event.preventDefault());
        
        // Disable Text Selection and Copy
        document.addEventListener('selectstart', event => event.preventDefault());
        document.addEventListener('copy', event => {
            event.preventDefault();
            alert("Tài liệu nội bộ: Không được phép sao chép!");
            if (event.clipboardData) {
                event.clipboardData.setData('text/plain', 'Tài liệu bản quyền TEAMDRCAT');
            }
        });
        
        // Disable DevTools shortcuts & Print
        document.addEventListener('keydown', function(e) {
            // F12
            if(e.key === 'F12' || e.keyCode === 123) {
                e.preventDefault();
                return false;
            }
            // Ctrl+Shift+I / J / C
            if(e.ctrlKey && e.shiftKey && ['I', 'J', 'C'].includes(e.key.toUpperCase())) {
                e.preventDefault();
                return false;
            }
            // Ctrl+U (View Source)
            if(e.ctrlKey && e.key.toUpperCase() === 'U') {
                e.preventDefault();
                return false;
            }
            // Ctrl+P (Print)
            if(e.ctrlKey && e.key.toUpperCase() === 'P') {
                e.preventDefault();
                return false;
            }
            // Ctrl+S (Save)
            if(e.ctrlKey && e.key.toUpperCase() === 'S') {
                e.preventDefault();
                return false;
            }
        });
        
        // Anti-Debugging
        setInterval(function() {
            var before = new Date().getTime();
            debugger;
            var after = new Date().getTime();
            if (after - before > 100) {
                // User has DevTools open
                document.body.innerHTML = "<div style='text-align:center; padding: 50px; font-family: sans-serif; font-weight: bold;'>Please close Developer Tools to continue using this application.</div>";
            }
        }, 1000);
    </script>
    <!-- END SECURITY SCRIPT -->

<script type="text/babel">

const { useState, useEffect, useRef } = React;

function parseQuizData(text) {
    const lines = text.split('\n').map(l => l.trim()).filter(l => l);
    const questions = [];
    let currentQ = null;
    let currentMode = 'context';
    let currentContext = "";
    let isBuildingContext = false;

    lines.forEach(line => {
        line = line.replace(/^[\u2022\u00b7\-\*]\s*/, '').trim();
        if (!line) return;

        const isSection = line.match(/^(?:PHẦN|Phần)\s+[I|V|X|\d]+/i);
        if (isSection) {
            currentContext = "";
            isBuildingContext = false;
        }

        const isCaseStart = line.match(/^(?:TÌNH HUỐNG LÂM SÀNG|Case lâm sàng|Tình huống|Case\s*\d+)/i);
        const isQ = line.match(/^(?:Câu|Question)(?:\s*hỏi)?\s*(?:số\s+|thứ\s+)?([\d\.]+)(?:[^a-z0-9a-záàạảãăắằặẳẵâấầậẩẫéèẹẻẽêếềệểễíìịỉĩóòọỏõôốồộổỗơớờợởỡúùụủũưứừựửữýỳỵỷỹđ]*[:\.\-])?\s*(.*)/i);
        const isOpt = line.match(/^\(?([A-E])\)?[\.\)\:\-\/]\s*(.*)/i);
        const isAns = line.match(/^(?:Đáp án(?: đúng)?|Answer)\s*[:\.\-]?\s*\(?([A-E])\)?/i);

        if (isCaseStart && !isQ) {
            currentContext = line + '\n';
            isBuildingContext = true;
            currentMode = 'context';
            return;
        }

        if (isQ && !isAns) {
            isBuildingContext = false;
            if (currentQ) questions.push(currentQ);
            
            currentQ = { 
                id: questions.length + 1, 
                originalId: isQ[1], 
                context: currentContext.trim(), 
                question: isQ[2] || '', 
                options: {}, 
                answer: '' 
            };
            currentMode = 'question';
            return;
        }

        if (isAns && currentQ) {
            currentQ.answer = isAns[1].toUpperCase();
            currentMode = 'skip';
            return;
        }
        
        if (line.match(/^(Giải thích|Tại sao các lựa chọn khác|Tài liệu được biên soạn|Nghiêm cấm sao chép|Đúng:|Sai:)/i)) {
            currentMode = 'skip';
            return;
        }

        if (currentMode === 'skip') return;

        if (isBuildingContext) {
            if (!line.match(/^(TRẮC NGHIỆM|BASEDOW|BỆNH LÝ BASEDOW|HỘI CHỨNG|ĐỘT QUỴ|ĐỘNG KINH|COPD|ĐÁI MÁU|NỘI KHOA|TEAMDRCAT|==========|Tài liệu được|Nghiêm cấm|\[🛑)/i)) {
                currentContext += line + '\n';
            }
            return;
        }

        if (currentQ) {
            if (isOpt) {
                currentQ.options[isOpt[1].toUpperCase()] = isOpt[2].trim();
                currentMode = 'options';
            } else if (currentMode === 'question') {
                currentQ.question += '\n' + line;
            } else if (currentMode === 'options') {
                const keys = Object.keys(currentQ.options);
                if (keys.length > 0) {
                    const lastKey = keys[keys.length - 1];
                    currentQ.options[lastKey] += '\n' + line;
                }
            } 
        }
    });
    if (currentQ) questions.push(currentQ);

    const mergedQuestions = [];
    questions.forEach(q => {
        const isAnswerKey = Object.keys(q.options).length === 0 && !q.context;
        if (isAnswerKey) {
            const existingQ = mergedQuestions.find(mq => mq.originalId === q.originalId && !mq.answer);
            if (existingQ) {
                if (q.answer) existingQ.answer = q.answer;
                return;
            }
        }
        mergedQuestions.push(q);
    });
    mergedQuestions.forEach((q, idx) => { q.id = idx + 1; });
    questions.length = 0;
    mergedQuestions.forEach(q => questions.push(q));

    const cln = (s) => (s||'').replace(/\\n\\n/gi, ' ').replace(/\\n/gi, ' ').trim();
    questions.forEach(q => { if(q.context) q.context=cln(q.context); if(q.question) q.question=cln(q.question); for(let k in q.options) q.options[k]=cln(q.options[k]); });
    return questions;
}

const playCorrectSound = () => {
    try {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        if (!AudioContext) return;
        const ctx = new AudioContext();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.type = 'sine';
        osc.frequency.setValueAtTime(600, ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(1200, ctx.currentTime + 0.1);
        gain.gain.setValueAtTime(0.1, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.15);
        osc.start(ctx.currentTime);
        osc.stop(ctx.currentTime + 0.15);
    } catch (e) { console.error(e); }
};

const playIncorrectSound = () => {
    try {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        if (!AudioContext) return;
        const ctx = new AudioContext();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(300, ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(150, ctx.currentTime + 0.2);
        gain.gain.setValueAtTime(0.1, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.2);
        osc.start(ctx.currentTime);
        osc.stop(ctx.currentTime + 0.2);
    } catch (e) { console.error(e); }
};

    const [time, setTime] = React.useState(new Date());
    React.useEffect(() => {
        const timer = setInterval(() => setTime(new Date()), 1000);
        return () => clearInterval(timer);
    }, []);

                if (answers[i] === questions[i].answer) correctCount++;
            }
            if (questions.length > 0 && (correctCount / questions.length) >= 0.5) {
                const duration = 3 * 1000;
                const animationEnd = Date.now() + duration;
                const defaults = { startVelocity: 30, spread: 360, ticks: 60, zIndex: 9999 };
                const randomInRange = (min, max) => Math.random() * (max - min) + min;
                const interval = setInterval(function() {
                    const timeLeft = animationEnd - Date.now();
                    if (timeLeft <= 0) { return clearInterval(interval); }
                    const particleCount = 50 * (timeLeft / duration);
                    window.confetti(Object.assign({}, defaults, { particleCount, origin: { x: randomInRange(0.1, 0.3), y: Math.random() - 0.2 } }));
                    window.confetti(Object.assign({}, defaults, { particleCount, origin: { x: randomInRange(0.7, 0.9), y: Math.random() - 0.2 } }));
                }, 250);
            }
        }
    }, [appState]);

    const formatTime = (date) => {
        const d = date.getDay();
        const days = ['Chủ Nhật', 'Thứ Hai', 'Thứ Ba', 'Thứ Tư', 'Thứ Năm', 'Thứ Sáu', 'Thứ Bảy'];
        const dayStr = days[d];
        const dateStr = date.toLocaleDateString('vi-VN', {day:'2-digit', month:'2-digit', year:'numeric'});
        const timeStr = date.toLocaleTimeString('vi-VN', {hour:'2-digit', minute:'2-digit', second:'2-digit'});
        return `${timeStr} - ${dayStr}, ${dateStr}`;
    };
    return (
        <div className="hidden lg:flex items-center gap-2 px-3 py-1.5 rounded-lg border border-slate-200 dark:border-slate-700 bg-white/50 dark:bg-slate-800/50 text-slate-600 dark:text-slate-300 font-mono text-xs font-bold shadow-sm">
            <i className="fa-regular fa-clock text-rose-500"></i>
            {formatTime(time)}
        </div>
    );
};

        }
    }, [isOpen]);

        e.preventDefault();

            setIsOpen(false);

    return (

                    <div className="fixed left-4 right-4 top-24 sm:absolute sm:left-auto sm:right-0 sm:top-full mt-3 p-3 glass-panel rounded-2xl shadow-2xl border border-white/60 dark:border-slate-700/60 sm:w-[350px] z-[999] animate-in fade-in slide-in-from-top-2 duration-300">

                            />
                        </div>
                        <button type="submit" className="p-2.5 btn-gradient text-white rounded-xl shadow-md hover:-translate-y-0.5 transition-transform"><i className="fa-solid fa-arrow-right"></i></button>
                    </form>
                    <div className="mt-2 text-[10px] text-center text-slate-400 dark:text-slate-500 font-semibold uppercase tracking-widest">Mở trong Tab mới</div>
                <button type="button" onClick={() => setIsOpen(false)} className="mt-3 w-full border border-red-200 bg-red-50 text-red-500 dark:bg-red-900/40 dark:border-red-800 py-2.5 rounded-xl text-[10px] font-black uppercase tracking-widest hover:bg-red-100 transition-colors shadow-sm">Đóng Tìm Kiếm <i className="fas fa-times ml-1"></i></button>
                </div>
                </React.Fragment>
            )}
        </div>
    );
};

function App() {
    const [appState, setAppState] = useState('intro');
    const [passwordInput, setPasswordInput] = useState('');
    const [showPassword, setShowPassword] = useState(false);
    const [pwError, setPwError] = useState(false);
    const [unlockCountdown, setUnlockCountdown] = useState(3);
    const [questions, setQuestions] = useState([]);
    const diseaseName = document.title.replace('NỘI KHOA: ', '').replace(' - TEAMDRCAT', '').replace('TEAMDRCAT | ', '').trim() || 'LÂM SÀNG';
    const [currentIndex, setCurrentIndex] = useState(0);
    const [answers, setAnswers] = useState({});
    const [flagged, setFlagged] = useState(new Set());
    const [timeRemaining, setTimeRemaining] = useState(0); 
    const [showMatrix, setShowMatrix] = useState(window.innerWidth >= 768);
    const [isPaused, setIsPaused] = useState(false);
        const [isDarkMode, setIsDarkMode] = useState(false);
    const [showDrNote, setShowDrNote] = useState(false);
    const [drNoteContent, setDrNoteContent] = useState("");
    const [notePos, setNotePos] = useState({x: window.innerWidth - 320, y: 100});
    const [isSoundEnabled, setIsSoundEnabled] = useState(true);
      const [zoomLevel, setZoomLevel] = useState(100);
    
    const scrollContainerRef = useRef(null);
    const [vantaEffect, setVantaEffect] = useState(null);
    
        useEffect(() => {
        const rootEl = document.getElementById('root');
        if (!vantaEffect && window.VANTA && window.VANTA.NET && rootEl) {
            try {
                if (window.innerWidth < 1025) return; 
                const isMobile = window.innerWidth < 768;
                /* Vanta completely disabled */
            
            } catch(e) {
                console.warn("Vanta initialize skipped", e);
            }
        }
        return () => {
            if (vantaEffect) vantaEffect.destroy();
        }
    }, [vantaEffect]);

    useEffect(() => {
        if (vantaEffect && typeof vantaEffect.setOptions === 'function') {
            try {
                vantaEffect.setOptions({
                    color: isDarkMode ? 0x22d3ee : 0x0284c7,
                    backgroundColor: isDarkMode ? 0x020617 : 0xf0f9ff
                })
            } catch(e) {}
        }
    }, [isDarkMode, vantaEffect]);


    const playHeartbeatSound = () => {
        try {
            const AudioContext = window.AudioContext || window.webkitAudioContext;
            if (!AudioContext) return;
            const ctx = new AudioContext();
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.type = 'sine';
            osc.frequency.setValueAtTime(60, ctx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(30, ctx.currentTime + 0.1);
            gain.gain.setValueAtTime(0.5, ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.2);
            osc.start(ctx.currentTime);
            osc.stop(ctx.currentTime + 0.2);
        } catch (e) { }
    };

    useEffect(() => {
        function b64DecodeUnicode(str) {
            return decodeURIComponent(atob(str).split('').map(function(c) {
                return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
            }).join(''));
        }
        const rawB64 = document.getElementById('quizData').textContent.trim() || '';
        let rawData = '';
        try { rawData = b64DecodeUnicode(rawB64); } catch(e) { rawData = rawB64; }
        const parsedQs = parseQuizData(rawData);
        setQuestions(parsedQs);
        
        const unlockKey = 'teamdrcat_unlocked_' + document.title;
        if (localStorage.getItem(unlockKey) === 'true') {
            setAppState('intro');
        }
        
        const storageKey = 'teamdrcat_' + document.title;
        const saved = localStorage.getItem(storageKey);
        if(saved) {
            try {
                const data = JSON.parse(saved);
                setAnswers(data.answers || {});
                setFlagged(new Set(data.flagged || []));
                if (data.timeRemaining) setTimeRemaining(data.timeRemaining);
                else setTimeRemaining(parsedQs.length * 60);
                if (data.currentIndex) setCurrentIndex(data.currentIndex);
                if (data.drNoteContent) setDrNoteContent(data.drNoteContent);
            } catch(e) {
                setTimeRemaining(parsedQs.length * 60);
            }
        } else {
            setTimeRemaining(parsedQs.length * 60);
        }
    }, []);

    useEffect(() => {
        const preventDefault = (e) => e.preventDefault();
        const preventKeyboard = (e) => {
            if (e.keyCode === 123) e.preventDefault();
            if (e.ctrlKey && e.shiftKey && e.keyCode === 73) e.preventDefault();
            if (e.ctrlKey && e.shiftKey && e.keyCode === 74) e.preventDefault();
            if (e.ctrlKey && e.keyCode === 85) e.preventDefault();
            if (e.ctrlKey && e.keyCode === 83) e.preventDefault();
        };
        document.addEventListener('contextmenu', preventDefault);
        document.addEventListener('keydown', preventKeyboard);
        document.addEventListener('dragstart', preventDefault);
        return () => {
            document.removeEventListener('contextmenu', preventDefault);
            document.removeEventListener('keydown', preventKeyboard);
            document.removeEventListener('dragstart', preventDefault);
        }
    }, []);

    useEffect(() => {
        if(questions.length > 0 && appState === 'quiz') {
            const storageKey = 'teamdrcat_' + document.title;
            localStorage.setItem(storageKey, JSON.stringify({
                answers: answers,
                flagged: Array.from(flagged),
                timeRemaining: timeRemaining,
                currentIndex: currentIndex,
                drNoteContent: drNoteContent
            }));
        }
    }, [answers, flagged, timeRemaining, questions.length, appState, currentIndex, drNoteContent]);

    useEffect(() => {
        if (appState === 'result' && scrollContainerRef.current) {
            scrollContainerRef.current.scrollTo({ top: 0, behavior: 'smooth' });
        }
    }, [appState]);

    useEffect(() => {
        let timer;
        if (appState === 'quiz' && !isPaused && timeRemaining > 0) {
            timer = setInterval(() => {
                setTimeRemaining(p => {
                    if (p <= 10 && p > 0 && isSoundEnabled) playHeartbeatSound();
                    return p - 1;
                });
            }, 1000);
        } else if (timeRemaining <= 0 && appState === 'quiz') {
            setAppState('result');
        }
        
        return () => clearInterval(timer);
    }, [appState, timeRemaining, isPaused, isSoundEnabled]);

    useEffect(() => {
        if (appState === 'unlocking') {
            if (unlockCountdown > 0) {
                const timer = setTimeout(() => {
                    setUnlockCountdown(c => c - 1);
                    if (isSoundEnabled) playCorrectSound();
                }, 1000);
                return () => clearTimeout(timer);
            } else {
                setAppState('intro');
            }
        }
    }, [appState, unlockCountdown, isSoundEnabled]);

    useEffect(() => {
        const handleKeyDown = (e) => {
            if(appState !== 'quiz' || isPaused) return;
            if(e.target.tagName === 'BUTTON' || e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
            
            const q = questions[currentIndex];
            if(!q) return;
            const optKeys = Object.keys(q.options);
            const keyMap = {'1':0, '2':1, '3':2, '4':3, 'a':0, 'b':1, 'c':2, 'd':3};
            const mappedIdx = keyMap[e.key.toLowerCase()];
            
            if(mappedIdx !== undefined && mappedIdx < optKeys.length) {
                const selectedKey = optKeys[mappedIdx];
                if (!answers[currentIndex]) {
                    setAnswers(prev => ({ ...prev, [currentIndex]: selectedKey }));
                    if (isSoundEnabled) {
                        q.answer === selectedKey ? playCorrectSound() : playIncorrectSound();
                    }
                }
            }
            if(e.key === 'ArrowRight' || e.key === 'ArrowDown') {
                e.preventDefault();
                setCurrentIndex(p => Math.min(questions.length - 1, p + 1));
            }
            if(e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
                e.preventDefault();
                setCurrentIndex(p => Math.max(0, p - 1));
            }
            if(e.key === ' ' || e.code === 'Space') {
                e.preventDefault();
                setFlagged(prev => {
                    const newFlagged = new Set(prev);
                    if (newFlagged.has(currentIndex)) newFlagged.delete(currentIndex);
                    else newFlagged.add(currentIndex);
                    return newFlagged;
                });
            }
        };
        window.addEventListener('keydown', handleKeyDown);
        return () => window.removeEventListener('keydown', handleKeyDown);
    }, [appState, isPaused, currentIndex, questions, answers, isSoundEnabled]);

    useEffect(() => {
        if (isDarkMode) document.documentElement.classList.add('dark');
        else document.documentElement.classList.remove('dark');
    }, [isDarkMode]);

      }, [zoomLevel]);

    
    React.useEffect(() => {
        if (appState === 'result' && window.confetti) {

            for (let i = 0; i < questions.length; i++) {
                if (answers[i] === questions[i].answer) correctCount++;
            }
            if (questions.length > 0 && (correctCount / questions.length) >= 0.5) {
                const duration = 3 * 1000;
                const animationEnd = Date.now() + duration;
                const defaults = { startVelocity: 30, spread: 360, ticks: 60, zIndex: 9999 };
                const randomInRange = (min, max) => Math.random() * (max - min) + min;
                const interval = setInterval(function() {
                    const timeLeft = animationEnd - Date.now();
                    if (timeLeft <= 0) { return clearInterval(interval); }
                    const particleCount = 50 * (timeLeft / duration);
                    window.confetti(Object.assign({}, defaults, { particleCount, origin: { x: randomInRange(0.1, 0.3), y: Math.random() - 0.2 } }));
                    window.confetti(Object.assign({}, defaults, { particleCount, origin: { x: randomInRange(0.7, 0.9), y: Math.random() - 0.2 } }));
                }, 250);
            }
        }
    }, [appState]);

    const formatTime = (seconds) => {
        const h = Math.floor(seconds / 3600);
        const m = Math.floor((seconds % 3600) / 60);
        const s = seconds % 60;
        if (h > 0) return `${h}:${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
        return `${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
    };

            return;
        }
        setAppState('quiz');
        // Restart logic
        if(Object.keys(answers).length === questions.length) {
            setAnswers({}); setFlagged(new Set()); setTimeRemaining(questions.length * 60); setCurrentIndex(0);
        }
        setIsPaused(false);

                a.volume = 0.5;

            } catch(e){}

        if (isSoundEnabled) {
            if (isCorrect) {
                playCorrectSound();

            }

        setAnswers(prev => ({ ...prev, [currentIndex]: key }));

                </div>

                                <div className="flex items-center gap-6 text-left w-full md:w-auto">
                                    <div className="w-20 h-20 bg-gradient-to-br from-violet-500 to-fuchsia-600 rounded-2xl flex items-center justify-center text-white shadow-[0_0_30px_rgba(59,130,246,0.3)] shrink-0">
                                        <i className="fa-solid fa-heart-pulse text-4xl"></i>
                                    </div>
                                    <div>
                                        <h2 className="text-rxl md:text-3xl font-black text-white tracking-tight uppercase mb-1">Báo Cáo Hội Chẩn</h2>
                                        <div className="flex items-center gap-3 flex-wrap">
                                            <span className="text-violet-400 font-bold uppercase tracking-widest text-xs">TeamDrCat E-Health</span>
                                        </div>
                                    </div>
                                </div>
                                <div className="mt-6 md:mt-0 w-full md:w-auto flex justify-end">
                                    {percent < 0.5 ? (
                                        <div className="px-5 py-2.5 rounded-xl bg-red-500/10 border border-red-500/30 text-red-500 font-black text-sm uppercase tracking-widest flex items-center gap-3 shadow-[0_0_15px_rgba(239,68,68,0.2)]">

                                            KHẨN CẤP

                                    <i className="fa-solid fa-magnifying-glass-plus text-emerald-500 w-5 text-center"></i> <span className="text-sm font-semibold dark:text-slate-300">Phóng to</span>
                                </button>
                                <button onClick={() => setZoomLevel(prev => Math.max(prev - 10, 50))} className="text-left w-full px-4 py-2.5 hover:bg-slate-100 dark:hover:bg-slate-700 rounded-xl flex items-center gap-3 transition-colors">
                                    <i className="fa-solid fa-magnifying-glass-minus text-emerald-500 w-5 text-center"></i> <span className="text-sm font-semibold dark:text-slate-300">Thu nhỏ</span>
                                </button>
                                <button onClick={() => setIsDarkMode(!isDarkMode)} className="text-left w-full px-4 py-2.5 hover:bg-slate-100 dark:hover:bg-slate-700 rounded-xl flex items-center gap-3 transition-colors border-t border-slate-100 dark:border-slate-700/50 mt-1 pt-3">
                                    {isDarkMode ? <><i className="fa-solid fa-sun text-amber-500 w-5 text-center"></i> <span className="text-sm font-semibold dark:text-slate-300">Nền Sáng</span></> : <><i className="fa-solid fa-moon text-blue-500 w-5 text-center"></i> <span className="text-sm font-semibold dark:text-slate-300">Nền Tối</span></>}
                                </button>
                            </div>
                        </div>
                        {['quiz', 'review', 'result'].includes(appState) && (
                            <React.Fragment>
                        <button onClick={() => setShowDrNote(!showDrNote)} className="p-2.5 bg-yellow-100/80 dark:bg-yellow-900/50 rounded-xl hover:bg-yellow-200 dark:hover:bg-yellow-800 transition-colors text-yellow-700 dark:text-yellow-400 border border-yellow-300/50 dark:border-yellow-700/50 shadow-sm" title="Mở sổ tay">
                            <i className="fa-solid fa-notes-medical text-lg"></i>
                        </button>
                            </React.Fragment>
                        )}
                        {appState === 'quiz' && (
                            <React.Fragment>
                                <div className={`px-4 py-2 rounded-xl font-mono text-lg font-black border flex items-center gap-3 shadow-sm transition-colors ${timeRemaining < 120 ? 'bg-red-50/90 dark:bg-red-900/50 border-red-300 dark:border-red-700 text-red-600 dark:text-red-400 border-2' : 'bg-white/80 dark:bg-slate-800/80 border-white/80 dark:border-slate-600 text-violet-700 shadow-md dark:text-violet-300'}`}>
                                    <i className={`fa-solid fa-heart-pulse text-xl ${timeRemaining < 120 ? 'animate-heartbeat-fast' : 'animate-heartbeat'}`}></i>
                                    {formatTime(timeRemaining)}
                                </div>
                                <button onClick={togglePause} className="p-2.5 bg-white/60 dark:bg-slate-700/60 rounded-xl hover:bg-white dark:hover:bg-slate-600 transition-colors text-violet-600 dark:text-violet-400 border border-white/40 dark:border-slate-600/50 shadow-sm">
                                    {isPaused ? <i className="fa-solid fa-play text-lg"></i> : <i className="fa-solid fa-pause text-lg"></i>}
                                </button>
                            </React.Fragment>
                        )}
                        {appState === 'review' && <div className="px-4 py-2 rounded-xl font-black bg-amber-100/90 dark:bg-amber-900/50 text-amber-700 dark:text-amber-400 flex items-center gap-2 border border-amber-300/50 dark:border-amber-700/50 shadow-sm"><i className="fa-solid fa-eye"></i> <span className="hidden sm:inline uppercase text-xs tracking-wider">Xem lại</span></div>}
                        <button className="bg-white/60 dark:bg-slate-700/60 text-violet-600 dark:text-violet-400 p-2.5 rounded-xl flex items-center justify-center border border-white/40 dark:border-slate-600/50 shadow-sm" onClick={() => setShowMatrix(!showMatrix)}><i className="fa-solid fa-bars text-lg"></i></button>
                    </div>
                </header>

                <div ref={scrollContainerRef} className="flex-1 overflow-y-auto p-4 md:p-8 custom-scrollbar relative z-0">
                    <div className="max-w-4xl mx-auto w-full pb-8">
                        {renderQuizContent()}
                    </div>
                </div>
            </main>
        </div>
    );
}


class ErrorBoundary extends React.Component {
    constructor(props) { super(props); this.state = { hasError: false, error: null, info: null }; }
    static getDerivedStateFromError(error) { return { hasError: true, error }; }
    componentDidCatch(error, info) { this.setState({ error, info }); console.error("REACT CRASH: ", error, info); }
    render() {
        if (this.state.hasError) {
            return (
                <div style={{padding: '40px', background: 'white', color: 'red', minHeight: '100vh', zIndex: 99999, position: 'relative'}}>
                    <h1 style={{fontSize: '24px', fontWeight: 'bold'}}>HỆ THỐNG GẶP LỖI (CRASH)</h1>
                    <p style={{marginTop: '10px'}}>{this.state.error && this.state.error.toString()}</p>
                    <pre style={{marginTop: '20px', background: '#ffebee', padding: '15px', borderRadius: '8px', overflow: 'auto', fontSize: '12px'}}>
                        {this.state.info && this.state.info.componentStack}
                    </pre>
                    <button onClick={() => { localStorage.clear(); window.location.reload(); }} style={{marginTop: '20px', background: 'red', color: 'white', padding: '10px 20px', borderRadius: '8px'}}>Khôi phục / Làm lại từ đầu (Xoá bộ nhớ)</button>
                </div>
            );
        }
        return this.props.children;
    }
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<ErrorBoundary><App /></ErrorBoundary>);


</script>


    <!-- PURE HTML FLOATING NAV - LOADS INSTANTLY -->

        <button onclick="if(window.self !== window.top){window.parent.postMessage({action:'closeQuiz'},'*');}else if(window.opener){window.close();}else{window.location.href='index.html';}" class="hover:text-white active:scale-95 transition-all flex items-center gap-1.5 sm:gap-2 pr-3 sm:pr-5">
            <i class="fa-solid fa-house text-sm sm:text-lg md:text-xl"></i> Trang Chủ
        </button>
        <button id="btn-luu-pure" onclick="toggleLuuPure(this)" class="active:scale-95 transition-all flex items-center gap-1.5 sm:gap-2 px-3 sm:px-5 hover:text-white">
            <i class="fa-solid fa-heart text-sm sm:text-lg md:text-xl"></i> Lưu
        </button>
        <button id="btn-xong-pure" onclick="toggleXongPure(this)" class="active:scale-95 transition-all flex items-center gap-1.5 sm:gap-2 pl-3 sm:pl-5 hover:text-white">
            <i class="fa-solid fa-circle-check text-sm sm:text-lg md:text-xl"></i> Đã Xong
        </button>
    </nav>
    <script>
        (function() {
            try {
                const u = window.location.pathname.split('/').pop().split('?')[0].split('#')[0];
                const b = JSON.parse(localStorage.getItem('pwa_bookmarks') || '[]');
                if(b.includes(u)) { document.write('<style>#btn-luu-pure { color: #f43f5e; font-weight: 900; filter: drop-shadow(0 4px 3px rgb(0 0 0 / 0.07)); }</style>'); }
                const c = JSON.parse(localStorage.getItem('pwa_completed') || '[]');
                if(c.includes(u)) { document.write('<style>#btn-xong-pure { color: #34d399; font-weight: 900; filter: drop-shadow(0 4px 3px rgb(0 0 0 / 0.07)); }</style>'); }
            } catch(e) {}
        })();
        function toggleLuuPure(btn) {
            try {
                const u = window.location.pathname.split('/').pop().split('?')[0].split('#')[0];
                let b = JSON.parse(localStorage.getItem('pwa_bookmarks') || '[]');
                let isGhim = false;
                if(!b.includes(u)) { b.push(u); window.customAlert('Đã ghim mốc Dấu Trang!'); isGhim = true; }
                else { b = b.filter(x => x !== u); window.customAlert('Đã hủy Dấu Trang!'); }
                localStorage.setItem('pwa_bookmarks', JSON.stringify(b));
                if (isGhim) { btn.classList.remove('hover:text-white'); btn.style.color = '#f43f5e'; btn.style.fontWeight = '900'; btn.style.filter = 'drop-shadow(0 4px 3px rgb(0 0 0 / 0.07))'; }
                else { btn.classList.add('hover:text-white'); btn.style.color = ''; btn.style.fontWeight = ''; btn.style.filter = ''; }
            } catch(e) { console.error(e); }
        }
        function toggleXongPure(btn) {
            try {
                const u = window.location.pathname.split('/').pop().split('?')[0].split('#')[0];
                let c = JSON.parse(localStorage.getItem('pwa_completed') || '[]');
                let isDone = false;
                if(!c.includes(u)) { c.push(u); window.customAlert('Đã đánh dấu bài học này là [Đã Xong]!'); isDone = true; }
                else { c = c.filter(x => x !== u); window.customAlert('Đã bỏ đánh dấu hoàn thành bài học!'); }
                localStorage.setItem('pwa_completed', JSON.stringify(c));
                if (isDone) { btn.classList.remove('hover:text-white'); btn.style.color = '#34d399'; btn.style.fontWeight = '900'; btn.style.filter = 'drop-shadow(0 4px 3px rgb(0 0 0 / 0.07))'; }
                else { btn.classList.add('hover:text-white'); btn.style.color = ''; btn.style.fontWeight = ''; btn.style.filter = ''; }
            } catch(e) { console.error(e); }
        }
    </script>


<script>
window.customConfirmDialog = function(msg, onConfirm) {
    const overlay = document.createElement('div');
    overlay.className = 'fixed inset-0 bg-slate-900/80 z-[99999] flex items-center justify-center backdrop-blur-sm transition-opacity duration-300';
    overlay.style.opacity = '0';
    
    const dialog = document.createElement('div');
    dialog.className = 'bg-white dark:bg-slate-800 p-6 sm:p-8 rounded-[2rem] shadow-2xl max-w-sm w-[90%] mx-auto transform transition-all duration-300 border border-slate-200 dark:border-slate-700 scale-95 opacity-0';
    
    const iconContainer = document.createElement('div');
    iconContainer.className = 'w-16 h-16 bg-violet-100 dark:bg-violet-900/50 rounded-full flex items-center justify-center mx-auto mb-4 text-violet-600 dark:text-violet-400 shadow-inner';
    iconContainer.innerHTML = '<i class="fa-solid fa-circle-question text-3xl"></i>';
    
    const title = document.createElement('h3');
    title.className = 'text-xl font-black text-slate-800 dark:text-white mb-2 text-center uppercase tracking-wider';
    title.innerText = 'Xác nhận';
    
    const message = document.createElement('p');
    message.className = 'text-slate-500 dark:text-slate-400 text-center mb-8 font-medium text-sm sm:text-base';
    message.innerText = msg;
    
    const btnContainer = document.createElement('div');
    btnContainer.className = 'flex gap-3 justify-center';
    
    const btnCancel = document.createElement('button');
    btnCancel.className = 'flex-1 px-5 py-3 rounded-xl font-bold bg-slate-100 dark:bg-slate-700 text-slate-600 dark:text-slate-300 hover:bg-slate-200 dark:hover:bg-slate-600 transition-all active:scale-95';
    btnCancel.innerText = 'Hủy';
    btnCancel.onclick = () => {
        overlay.style.opacity = '0';
        dialog.classList.remove('scale-100', 'opacity-100');
        dialog.classList.add('scale-95', 'opacity-0');
        setTimeout(() => { if(document.body.contains(overlay)) document.body.removeChild(overlay); }, 300);
    };
    
    const btnConfirm = document.createElement('button');
    btnConfirm.className = 'flex-1 px-5 py-3 rounded-xl font-bold bg-gradient-to-r from-blue-500 to-cyan-500 text-white hover:from-blue-600 hover:to-cyan-600 shadow-md transition-all active:scale-95 shadow-violet-500/30';
    btnConfirm.innerText = 'Đồng ý';
    btnConfirm.onclick = () => {
        overlay.style.opacity = '0';
        dialog.classList.remove('scale-100', 'opacity-100');
        dialog.classList.add('scale-95', 'opacity-0');
        setTimeout(() => { if(document.body.contains(overlay)) document.body.removeChild(overlay); }, 300);
        if(onConfirm) onConfirm();
    };
    
    btnContainer.appendChild(btnCancel);
    btnContainer.appendChild(btnConfirm);
    
    dialog.appendChild(iconContainer);
    dialog.appendChild(title);
    dialog.appendChild(message);
    dialog.appendChild(btnContainer);
    overlay.appendChild(dialog);
    
    document.body.appendChild(overlay);
    
    requestAnimationFrame(() => {
        overlay.style.opacity = '1';
        dialog.classList.remove('scale-95', 'opacity-0');
        dialog.classList.add('scale-100', 'opacity-100');
    });
};

window.customAlert = function(msg) {
    const toast = document.createElement('div');
    toast.className = 'fixed bottom-20 left-1/2 -translate-x-1/2 bg-slate-800 text-white px-6 py-3 rounded-full shadow-2xl z-[999999] flex items-center gap-3 transform transition-all duration-500 translate-y-10 opacity-0 font-bold tracking-wide text-sm border border-slate-700';
    toast.innerHTML = `<i class="fa-solid fa-bell text-rose-400"></i> ${msg}`;
    
    document.body.appendChild(toast);
    
    requestAnimationFrame(() => {
        toast.classList.remove('translate-y-10', 'opacity-0');
    });
    
    setTimeout(() => {
        toast.classList.add('translate-y-10', 'opacity-0');
        setTimeout(() => { if(document.body.contains(toast)) document.body.removeChild(toast); }, 500);
    }, 3000);
};
</script>
